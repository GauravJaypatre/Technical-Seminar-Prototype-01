[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aers-slm"
version = "0.1.0"
description = "Adaptive Evidence-Routed Sequential SLM Intelligence for Repository-Level Software Engineering"
readme = "README_member1.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
llama = [
    "llama-cpp-python>=0.2.90",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "fixtures", ".*", "build", "dist"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]
